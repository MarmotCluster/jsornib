*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Inconsolata", monospace;
  font-display: optional;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --primary-main: palette.$primary-main;
  --primary-light: palette.$primary-light;
  --primary-dark: palette.$primary-dark;
  --primary-darker: palette.$primary-darker;
  --primary-darkest: palette.$primary-darkest;
  --secondary-main: palette.$secondary-main;
  --secondary-dark: palette.$secondary-dark;
}

html,
body {
  width: 100%;
  height: 100%;
}

button,
label {
  font-size: 0.875rem;
}

::-webkit-scrollbar {
  display: none;
}

::selection {
  color: white;
  background-color: #e56f3a;
}

.flexy {
  display: flex;
  justify-content: center;
  align-items: center;
}

.disablemousy {
  pointer-events: none;
  user-select: none;
  touch-action: none;
}

.fullscreen {
  width: 100dvw;
  height: 100dvh;
}

.primary-main {
  color: #e56f3a !important;
}
.primary-light {
  color: #feb57e !important;
}
.primary-dark {
  color: #721e0f !important;
}
.primary-darker {
  color: #551409 !important;
}
.primary-darkest {
  color: #180100 !important;
}

.secondary-main {
  color: #6a921a !important;
}
.secondary-dark {
  color: #405711 !important;
}

.link:active {
  color: #721e0f;
}
.link {
  cursor: pointer;
  user-select: none;
  text-decoration: underline;
  color: #e56f3a;
  transition: color 0.2s ease;
}

.button {
  position: relative;
}
.button-primary:active {
  background-color: #721e0f;
}
.button-primary {
  cursor: pointer;
  outline: none;
  border: none;
  background-color: #e56f3a;
  transition: background-color 0.06s ease-in;
  color: #f4f4f4;
  border-radius: 0;
  padding: 0.25rem 1rem;
  width: fit-content;
  user-select: none;
}
.button-primary__disabled:active {
  background-color: #999;
}
.button-primary__disabled {
  background-color: #999;
}
.button__wrapper {
  display: block;
  width: 100%;
  height: 100%;
  background-color: red;
}

.no-shrink {
  flex-shrink: 0;
}
.no-wrap {
  white-space: nowrap;
}

.font-bold {
  font-weight: bold;
}
.font-regular {
  font-weight: normal;
}
.font-light {
  font-weight: light;
}

.display-flex {
  display: flex;
}
.display-none {
  display: none;
}

.flex-direction-col {
  flex-direction: column;
}
.flex-direction-row {
  flex-direction: row;
}

.gap-col {
  column-gap: 0.5rem;
}
.gap-col-half {
  column-gap: 0.25rem;
}
.gap-col-quat {
  column-gap: 0.125rem;
}
.gap-row {
  row-gap: 0.5rem;
}
.gap-row-half {
  row-gap: 0.25rem;
}
.gap-row-quat {
  row-gap: 0.125rem;
}

/* **  ** */
.header {
  height: 64px;
  background-color: #f4f4f4;
  padding: 0.5rem;
  display: flex;
  column-gap: 1rem;
}
.header-logo {
  width: 48px;
  height: 48px;
  flex-shrink: 0;
  background-size: 100%;
  background-repeat: no-repeat;
  background-position: center;
  cursor: pointer;
  transition: background-size 0.2s ease;
}
.header-logo:active {
  background-size: 90%;
}
.header-containable {
  overflow-x: scroll;
}

.h-with-header {
  height: calc(100dvh - 64px);
}

.foldable:hover {
  background-color: rgba(0, 0, 0, 0.18);
}
.foldable {
  color: #e0e0e0;
}
.foldable-title {
  font-weight: bold;
  color: #e56f3a;
}

.bracket {
  color: #e0e0e0;
}
.bracket-content {
  padding-left: 1rem;
  border-left: 1px solid rgba(255, 255, 255, 0.18);
}

.viewer__bg {
  position: sticky;
  top: 0px;
  left: 0px;
  border: 1px solid red;
}
.viewer {
  position: relative;
  width: 100%;
  user-select: none;
  overflow-y: scroll;
  background-color: #333;
  scroll-behavior: smooth;
  background-size: min(82dvh, 256px);
  background-repeat: no-repeat;
  background-position: center;
}
.viewer__content {
  position: relative;
  z-index: 1;
  padding: 0.5rem;
}

.focused {
  border: 1px solid #e56f3a;
  border-radius: 2px;
}
.focused-not {
  border: 1px solid transparent;
}
